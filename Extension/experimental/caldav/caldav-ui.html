<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CalDAV リマインダー同期設定</title>
  <link rel="stylesheet" href="caldav-ui.css">
</head>

<body>
  <div class="caldav-container">
    <header class="caldav-header">
      <h1>
        🍎 iCloud リマインダー同期
        <span class="caldav-badge">実験的</span>
      </h1>
      <p class="subtitle">WebClassの課題をAppleリマインダーに自動同期</p>
    </header>

    <!-- 警告セクション -->
    <div class="caldav-section">
      <div class="caldav-warning">
        <strong>⚠️ 注意事項</strong>
        • この機能は実験的なものです。予期せぬ動作が発生する可能性があります。<br>
        • iOS 13以降でリマインダーをアップグレードした場合、互換性の問題が発生する可能性があります。<br>
        • 認証情報はブラウザのローカルストレージに保存されます。
      </div>
    </div>

    <!-- 有効/無効切り替え -->
    <div class="caldav-section">
      <div class="caldav-checkbox-group">
        <input type="checkbox" id="caldavEnabled" class="caldav-checkbox">
        <label for="caldavEnabled" class="caldav-checkbox-label">
          CalDAV同期を有効にする
        </label>
      </div>
    </div>

    <!-- 認証設定 -->
    <div class="caldav-section" id="authSection">
      <h2>認証設定</h2>

      <div class="caldav-form-group">
        <label for="appleId">Apple ID</label>
        <input type="email" id="appleId" class="caldav-input" placeholder="example@icloud.com" autocomplete="email">
      </div>

      <div class="caldav-form-group">
        <label for="appPassword">アプリ用パスワード</label>
        <input type="password" id="appPassword" class="caldav-input" placeholder="xxxx-xxxx-xxxx-xxxx"
          autocomplete="off">
        <p style="font-size: 11px; color: #64748b; margin-top: 4px;">
          <a href="https://appleid.apple.com" target="_blank" style="color: #60a5fa;">appleid.apple.com</a>
          で「アプリ用パスワード」を生成してください
        </p>
      </div>

      <div class="caldav-btn-group">
        <button type="button" id="testConnection" class="caldav-btn caldav-btn-secondary">
          接続テスト
        </button>
        <button type="button" id="saveAuth" class="caldav-btn caldav-btn-primary">
          保存
        </button>
      </div>

      <div id="authStatus" class="caldav-hidden"></div>
    </div>

    <!-- リマインダーリスト選択 -->
    <div class="caldav-section caldav-hidden" id="listSection">
      <h2>リマインダーリスト</h2>

      <div class="caldav-form-group">
        <label for="reminderList">同期先のリスト</label>
        <select id="reminderList" class="caldav-select">
          <option value="">リストを選択...</option>
        </select>
      </div>

      <button type="button" id="refreshLists" class="caldav-btn caldav-btn-secondary">
        🔄 リストを更新
      </button>
    </div>

    <!-- 同期状態 -->
    <div class="caldav-section caldav-hidden" id="syncSection">
      <h2>同期状態</h2>

      <div class="caldav-sync-info">
        <div class="icon">📋</div>
        <div class="details">
          <div class="label">最終同期</div>
          <div class="value" id="lastSyncTime">未同期</div>
        </div>
      </div>

      <div class="caldav-sync-info">
        <div class="icon">✅</div>
        <div class="details">
          <div class="label">同期済みアイテム</div>
          <div class="value" id="syncedCount">0 件</div>
        </div>
      </div>

      <div class="caldav-btn-group">
        <button type="button" id="syncNow" class="caldav-btn caldav-btn-success">
          🔄 今すぐ同期
        </button>
        <button type="button" id="resetSync" class="caldav-btn caldav-btn-danger">
          🗑️ 同期リセット
        </button>
      </div>

      <div id="syncStatus" class="caldav-hidden"></div>
    </div>

    <!-- 同期済みリマインダー一覧 -->
    <div class="caldav-section caldav-hidden" id="remindersSection">
      <h2 class="caldav-collapsible" id="toggleReminders">同期済みリマインダー</h2>
      <div class="caldav-collapsible-content" id="remindersContent">
        <div id="remindersList">
          <!-- 動的に追加 -->
        </div>
      </div>
    </div>

    <!-- デバッグ用：手動で課題を追加 -->
    <div class="caldav-section caldav-hidden" id="debugSection">
      <h2>テスト用：課題を追加</h2>

      <div class="caldav-form-group">
        <label for="testTitle">課題タイトル</label>
        <input type="text" id="testTitle" class="caldav-input" placeholder="テスト課題">
      </div>

      <div class="caldav-form-group">
        <label for="testCourse">科目名</label>
        <input type="text" id="testCourse" class="caldav-input" placeholder="離散数学II">
      </div>

      <div class="caldav-form-group">
        <label for="testDeadline">締め切り</label>
        <input type="datetime-local" id="testDeadline" class="caldav-input">
      </div>

      <button type="button" id="addTestReminder" class="caldav-btn caldav-btn-primary">
        ➕ テストリマインダーを追加
      </button>
    </div>
  </div>

  <script src="caldav-client.js"></script>
  <script src="caldav-sync.js"></script>
  <script src="caldav-ui.js"></script>
</body>

</html>
